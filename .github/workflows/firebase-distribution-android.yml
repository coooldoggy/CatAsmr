name: Firebase App Distribution - Android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create Firebase Admin Key
        run: |
          echo "${{ secrets.FIREBASE_ADMIN_KEY }}" > firebase-admin-key.json

      - name: Build APK
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            ./gradlew app:assembleRelease
          else
            ./gradlew app:assembleDebug
          fi

      - name: Upload to Firebase App Distribution
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            ./gradlew app:appDistributionUploadRelease
          else
            ./gradlew app:appDistributionUploadDebug
          fi

      - name: Cleanup Firebase Admin Key
        if: always()
        run: rm -f firebase-admin-key.json

      - name: Notify on Success
        if: success()
        run: echo "✅ Build uploaded to Firebase App Distribution successfully"

      - name: Notify on Failure
        if: failure()
        run: echo "❌ Build upload failed"
